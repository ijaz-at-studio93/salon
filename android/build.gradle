buildscript {
    ext.kotlin_version = '2.2.20' // Use a recent Kotlin version
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Use an AGP version compatible with your Gradle version.
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    // This is the structure you should use for a generic fallback
                    namespace "com.example.${project.name}"
                }
            }
        }
    }

}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
